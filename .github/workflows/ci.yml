name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Swift 6 Xcode
        run: |
          sudo xcode-select -s "$(Scripts/select-xcode.sh)"
          swift --version
          xcodebuild -version

      - name: Build (warnings are errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          MANGLA_BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/build-app.sh release

      - name: Package app
        run: Scripts/package-app.sh

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mangla-app
          path: |
            dist/Mangla-*.zip
            dist/*.sha256
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download app artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mangla-app
          path: dist

      - name: Create stable release or refresh nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Scripts/publish-release.sh dist
